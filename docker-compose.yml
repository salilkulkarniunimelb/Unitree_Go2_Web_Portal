services:
  web-portal:
    build: .
    ports:
      - "7860:7860"
    volumes:
      - ./config.py:/app/config.py
      - ./data:/app/data
      - ./assets:/app/assets
    environment:
      - ROS_DOMAIN_ID=0
      - PYTHONUNBUFFERED=1
